interface:
  icon_small: "./assets/bilim-ai-head-logo.png"
  icon_large: "./assets/bilim-ai-head-logo.png"
  brand_color: "#754BFF"
  display_name: "Жылдық жоспар / Годовой план"
  short_description: "Классикалық немесе сызбалық жылдық жоспар жасау"
  default_prompt: "МДҰ-ның үш жылдық даму бағдарламасына сүйеніп жылдық жоспар жасау үшін $do-annual-plan дағдысын қолдан. Алдымен классикалық не сызбалық нұсқаны анықта, содан кейін бағдарламадан таңдалған жылдың міндеттерін, іс-шараларын және көрсеткіштерін ал. Екі нұсқада да ТУП ДО жас пен жүктеме үшін қолданылады. Қаріп Times New Roman 12 пт, кестелер бояусыз, адамдар туралы тек сандық мәліметтер. Даму бағдарламасы чатта болмаса, балабақшаның бағдарламасын сұрап, құжат алынғанша жылдық жоспарды жасама. Құжаттың соңында осы бағдарламаны және пайдаланылған материалдарды негіз ретінде міндетті түрде көрсет."
