interface:
  icon_small: "./assets/bilim-ai-head-logo.png"
  icon_large: "./assets/bilim-ai-head-logo.png"
  brand_color: "#754BFF"
  display_name: "Даму бағдарламасы / Программа развития"
  short_description: "МДҰ-ның үш жылдық даму бағдарламасы және жылдық міндеттер"
  default_prompt: "МДҰ-ның үш жылдық даму бағдарламасын берілген үлгі, ұсынымдар және қосымша әдістемелік сүйемелдеу бойынша жасау үшін $do-development-program дағдысын қолдан. Басталу жылын және күнтізбелік не оқу жылдары екенін нақтыла; жылдық жоспарға тиісті жылдың міндеттерін, іс-шараларын және көрсеткіштерін бөліп ал. Қызметкерлер мен балалар туралы тек сандық мәліметтерді пайдалан, дербес деректерді сұрама. Кестелер үлгі бойынша бояусыз; барлық мәтін Times New Roman 12 пт. Негізгі тіл — қазақ тілі, таңдау бойынша — орыс немесе ағылшын тілі. Бір ұйым мен бір үш жылдық кезең үшін бір даму бағдарламасын пайдалан. Құжаттың соңында пайдаланылған негіздерді міндетті түрде көрсет."
